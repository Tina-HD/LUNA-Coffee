name: Sync Supabase to JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: sync
        run: npm ci

      - name: Run Supabase sync
        run: node sync/sync.js

      - name: Commit updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add products-backup.json categories.json menu-preview.json settings.json

          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "Auto-sync Supabase data"
            git push
          fi
