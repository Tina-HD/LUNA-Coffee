<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUNA Coffee — Staff Login</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">


<style>


* {
    box-sizing: border-box;
}


body {

    margin:0;

    min-height:100vh;

    background:#F7F3ED;

    color:#25221F;

    font-family:'Inter', sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

}


.login-container {

    width:100%;

    max-width:420px;

    padding:50px;

    background:white;

    text-align:center;

}


.logo {

    font-family:'Playfair Display', serif;

    font-size:34px;

    font-weight:600;

    margin-bottom:10px;

}


.subtitle {

    color:#8B6F47;

    font-size:12px;

    letter-spacing:3px;

    margin-bottom:45px;

}



h1 {

    font-family:'Playfair Display', serif;

    font-size:38px;

    margin-bottom:35px;
    color:#8B6F47;

}



.input-group {

    text-align:left;

    margin-bottom:20px;

}


label {

    font-size:13px;

    color:#716a62;

}


input {

    width:100%;

    margin-top:8px;

    padding:14px;

    border:1px solid #ddd6cc;

    background:#F7F3ED;

    font-family:'Inter',sans-serif;

    outline:none;

}


input:focus {

    border-color:#8B6F47;

}



button {

    width:100%;

    margin-top:20px;

    padding:15px;

    border:none;

    background:#25221F;

    color:white;

    font-family:'Inter',sans-serif;

    cursor:pointer;

    transition:.3s;

}



button:hover {

    background:#8B6F47;

}



.message {

    margin-top:20px;

    font-size:14px;

    color:#8B6F47;

}



.back {

    display:block;

    margin-top:30px;

    font-size:13px;

    color:#716a62;

    text-decoration:none;

}



.back:hover {

    text-decoration:underline;

}


</style>


</head>


<body>


<div class="login-container">


    <div class="logo">
        LUNA Coffee
    </div>


    <div class="subtitle">
        STAFF ACCESS
    </div>


    <h1>
        Welcome
    </h1>


    <form id="login-form">


        <div class="input-group">

            <label>
                Email
            </label>

            <input 
            type="email"
            id="email"
            placeholder="your@email.com">

        </div>



        <div class="input-group">

            <label>
                Password
            </label>

            <input 
            type="password"
            id="password"
            placeholder="••••••••">

        </div>



        <button type="submit">
            Enter Dashboard
        </button>

        <a
            href="#"
            id="forgot-password"
            class="back"
        >
            Forgot password?
        </a>

        <div
            id="reset-section"
            style="display:none;"
        >

            <div class="input-group">

                <label>
                    Enter your email to reset your password
                </label>

                <input
                    type="email"
                    id="reset-email"
                    placeholder="your@email.com"
                >

            </div>

            <button
                type="button"
                id="reset-button"
            >
                Send Reset Link
            </button>

        </div>


    </form>



    <p class="message" id="login-message"></p>



    <a class="back" href="index.html">
        ← Back to website
    </a>


</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>

</html>
