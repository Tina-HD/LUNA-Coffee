<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LUNA Coffee — Product</title>

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
          rel="stylesheet">


    <style>

        /* =========================
           GENERAL
        ========================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background-color: #F7F3ED;
            color: #25221F;
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3 {
            font-family: 'Playfair Display', serif;
            margin-top: 0;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================
           HEADER
        ========================== */

        .header {
            height: 80px;
            padding: 0 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background-color: #F7F3ED;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 25px;
            font-weight: 600;
        }

        .navigation {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .navigation a {
            font-size: 14px;
            transition: color 0.2s;
        }

        .navigation a:hover {
            color: #8B6F47;
        }


        /* =========================
           ADMIN LOGIN ICON
        ========================== */

        .admin-login {

            width: 36px;

            height: 36px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            margin-left: 2px;

            color: #514438;

            border: 1px solid
                rgba(112, 92, 70, 0.14);

            border-radius: 50%;

            transition:
                color 0.25s ease,
                border-color 0.25s ease,
                background-color 0.25s ease,
                transform 0.25s ease;
        }


        .admin-login svg {

            width: 17px;

            height: 17px;

            fill: none;

            stroke: currentColor;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        .admin-login:hover {

            color: #8B6F47;

            border-color: #8B6F47;

            background-color:
                rgba(139, 111, 71, 0.05);

            transform: translateY(-1px);
        }


        /* =========================
           PRODUCT PAGE
        ========================== */

        .product-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 7% 120px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;

            color: #8B6F47;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .product-card {
            background-color: white;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 500px;
        }

        .product-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 35px 40px 40px;
        }

        .product-info h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .product-info span {
            color: #8B6F47;
            font-size: 18px;
            font-weight: 600;
        }

        .product-info p {
            color: #716A62;
            line-height: 1.7;
            margin-top: 18px;
        }


        /* =========================
           FOOTER
        ========================== */

        .footer {
            padding: 30px 7%;

            display: flex;
            justify-content: space-between;

            border-top: 1px solid #DDD6CC;

            color: #777066;
            font-size: 13px;
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 600px) {

            .header {
                height: auto;

                padding: 25px 5%;

                flex-direction: column;
                gap: 20px;
            }

            .navigation {
                gap: 15px;

                flex-wrap: wrap;
                justify-content: center;
            }

            .admin-login {

                width: 36px;

                height: 36px;

                margin-left: 2px;
            }

            .product-page {
                padding-top: 50px;
            }

            .product-image {
                height: 350px;
            }

            .product-info {
                padding: 25px;
            }

            .product-info h1 {
                font-size: 34px;
            }

            .footer {
                flex-direction: column;
                gap: 10px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <a class="logo" href="index.html">
            LUNA Coffee
        </a>

        <nav class="navigation">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="menu.html">
                Menu
            </a>

            <a href="contact.html">
                Contact
            </a>


            <!-- =========================
                 ADMIN LOGIN
            ========================== -->

            <a href="login.html"
               class="admin-login"
               aria-label="Staff Login"
               title="Staff Login">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true">

                    <circle
                        cx="12"
                        cy="8"
                        r="3.5">

                    </circle>

                    <path
                        d="M4.5 20c.8-3.5 3.4-5.5 7.5-5.5s6.7 2 7.5 5.5">

                    </path>

                </svg>

            </a>

        </nav>

    </header>


    <!-- =========================
         PRODUCT
    ========================== -->

    <main>

        <section class="product-page">

            <a href="menu.html" class="back-link">
                ← Back to Menu
            </a>


            <div class="product-card">

                <div class="product-image">

                    <img id="product-image"
                         src=""
                         alt="">

                </div>


                <div class="product-info">

                    <h1 id="product-name"></h1>

                    <span id="product-price"></span>

                    <p id="product-description"></p>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <p>
            © 2026 LUNA Coffee
        </p>

        <p>
            Slow mornings. Good coffee.
        </p>

    </footer>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>


</body>

</html>
