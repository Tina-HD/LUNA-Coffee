<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Update Password — LUNA Coffee</title>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #25221F;
            color: #F7F3ED;

            font-family: Arial, sans-serif;
        }

        .password-container {
            width: 90%;
            max-width: 420px;

            padding: 35px;

            background: #F7F3ED;
            color: #25221F;

            border-radius: 12px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 12px;

            text-align: center;

            font-size: 28px;
        }

        p {
            margin-bottom: 25px;

            text-align: center;

            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #8B6F47;
            border-radius: 6px;

            background: white;
            color: #25221F;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #25221F;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 6px;

            background: #25221F;
            color: #F7F3ED;

            cursor: pointer;

            font-size: 15px;

            transition: 0.2s ease;
        }

        button:hover {
            background: #8B6F47;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            min-height: 24px;

            margin-top: 18px;

            text-align: center;

            font-size: 14px;
        }

    </style>

</head>


<body>


    <main class="password-container">

        <h1>Update Password</h1>

        <p>
            Enter your new password below.
        </p>


        <form id="update-password-form">

            <div class="input-group">

                <label for="new-password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new-password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >

            </div>


            <div class="input-group">

                <label for="confirm-password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                id="update-button"
            >
                Update Password
            </button>

        </form>


        <p id="message"></p>

    </main>



    <script>

        // =====================================================
        // SUPABASE CONNECTION
        // =====================================================

        const supabaseUrl =
            "https://xrhdbxsawcdwrvcguojy.supabase.co";

        const supabaseKey =
            "sb_publishable_2Ev1ejVBz_q-tqkc76sSlA_A7fa4gc-";

        const supabaseClient =
            window.supabase.createClient(
                supabaseUrl,
                supabaseKey
            );


        // =====================================================
        // ELEMENTS
        // =====================================================

        const updatePasswordForm =
            document.getElementById(
                "update-password-form"
            );

        const newPasswordInput =
            document.getElementById(
                "new-password"
            );

        const confirmPasswordInput =
            document.getElementById(
                "confirm-password"
            );

        const updateButton =
            document.getElementById(
                "update-button"
            );

        const message =
            document.getElementById(
                "message"
            );


        // =====================================================
        // UPDATE PASSWORD
        // =====================================================

        updatePasswordForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const newPassword =
                    newPasswordInput.value.trim();

                const confirmPassword =
                    confirmPasswordInput.value.trim();


                // Check password length

                if (newPassword.length < 6) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                    return;
                }


                // Check matching passwords

                if (newPassword !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }


                updateButton.disabled = true;

                message.textContent =
                    "Updating password...";


                try {

                    const { error } =
                        await supabaseClient.auth.updateUser(
                            {
                                password: newPassword
                            }
                        );


                    if (error) {

                        console.error(
                            "Update password error:",
                            error
                        );

                        message.textContent =
                            "Could not update password. Please try again.";

                        updateButton.disabled = false;

                        return;
                    }


                    message.textContent =
                        "Password updated successfully!";


                    updatePasswordForm.reset();

                    updateButton.disabled = false;


                    setTimeout(
                        function () {

                            window.location.href =
                                "login.html";

                        },
                        2000
                    );


                } catch (error) {

                    console.error(
                        "Unexpected error:",
                        error
                    );

                    message.textContent =
                        "Something went wrong. Please try again.";

                    updateButton.disabled = false;

                }

            }
        );

    </script>


</body>

</html>
